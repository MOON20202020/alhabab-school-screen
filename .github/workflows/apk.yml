name: build-apk
on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleRelease --no-daemon
        working-directory: android
      - run: |
          mkdir -p out
          cp android/screen/build/outputs/apk/release/screen-release.apk out/alhabab-screen.apk
          cp android/admin/build/outputs/apk/release/admin-release.apk out/alhabab-admin.apk
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: تطبيقات شاشة الحباب
          files: out/*.apk
          make_latest: true
      - uses: actions/upload-artifact@v4
        with: { name: apks, path: out/*.apk }
